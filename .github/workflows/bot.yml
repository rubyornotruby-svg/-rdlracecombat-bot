# RDLRACECOMBAT — lance le bot paper trading toutes les 2 heures (après chaque clôture de bougie 2 h UTC).
name: Bot paper trading

on:
  schedule:
    - cron: "7 */2 * * *"   # 7 minutes après chaque clôture de bougie 2 h (heure UTC)
  workflow_dispatch:         # bouton « Run workflow » pour le lancer à la main

permissions:
  contents: write
  issues: write              # pour te poser la question au plancher 85 %

concurrency:
  group: bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lancer le bot (paper trading, aucun argent réel)
        run: python bot/bot.py
      - name: Plancher 85 % — question et 10 minutes pour répondre (seulement si besoin)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python bot/decision.py
      - name: Enregistrer l'état et les données du site
        if: always()
        run: |
          git config user.name "rdlracecombat-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json docs/data.json
          git diff --cached --quiet || git commit -m "Bot : passage du $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push
