# RDLRACECOMBAT — lance le bot paper trading toutes les 4 heures (après chaque clôture de bougie 4 h UTC).
name: Bot paper trading

on:
  schedule:
    - cron: "7 0,4,8,12,16,20 * * *"   # 7 minutes après chaque clôture de bougie 4 h (heure UTC)
  workflow_dispatch:                     # bouton « Run workflow » pour le lancer à la main

permissions:
  contents: write

concurrency:
  group: bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lancer le bot (paper trading, aucun argent réel)
        run: python bot/bot.py
      - name: Enregistrer l'état et les données du site
        run: |
          git config user.name "rdlracecombat-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json docs/data.json
          git diff --cached --quiet || git commit -m "Bot : passage du $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push
